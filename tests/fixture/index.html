<!doctype html><html lang="ko"><meta charset="utf-8"><title>Browser Tool Audit</title><style>body{font:17px system-ui;margin:30px;background:#f3f6fa;color:#17263c}section{padding:20px;margin:15px 0;background:white;border:1px solid #ddd}button,input,select,textarea{font:inherit;padding:8px;margin:5px}#drop{width:240px;height:90px;background:#cdf;padding:12px}#drag{display:inline-block;background:#fbc;padding:16px}iframe{width:500px;height:180px}#spacer{height:700px}output{display:block;padding:10px;background:#eef}</style>
<h1>Browser Tool Audit</h1><p>로컬 테스트 페이지 · 계정/결제 없음</p>
<section><label>Name<input id="name" aria-label="Name" placeholder="Enter name" data-testid="name-input"></label><label>Notes<textarea aria-label="Notes">initial notes</textarea></label><label><input type="checkbox" aria-label="Agree">Agree</label><select aria-label="Choice"><option value="a">Alpha</option><option value="b">Beta</option></select><button id="increment" data-testid="increment">Increment</button><output id="count">0</output><button disabled>Disabled</button><button style="display:none">Hidden</button><button id="nav" onclick="location.href='/next.html'">Next page</button></section>
<section><ul id="items"><li class="item" data-kind="fruit">Apple</li><li class="item" data-kind="fruit">Banana</li><li class="item" data-kind="other">Carrot</li></ul><details><summary>Details</summary><p>Expanded content</p></details></section>
<section><button onclick="setTimeout(()=>alert('audit alert'),500)">Alert</button><button onclick="setTimeout(()=>document.querySelector('#dialog-result').textContent=confirm('audit confirm'),500)">Confirm</button><button onclick="setTimeout(()=>document.querySelector('#dialog-result').textContent=prompt('audit prompt','default'),500)">Prompt</button><button onclick="window.onbeforeunload=e=>{e.preventDefault();e.returnValue=''}">Arm beforeunload</button><output id="dialog-result">none</output></section>
<section><button onclick="document.querySelector('#single').click()">Upload single</button><input type="file" id="single" hidden><button onclick="document.querySelector('#multi').click()">Upload multiple</button><input type="file" id="multi" multiple hidden><output id="files">none</output><a id="download" href="/sample.txt" download="audit-sample.txt">Download sample</a><a id="image-download" href="/pixel.png" download="audit-pixel.png">Download image</a><img src="/pixel.png" alt="Audit pixel" width="40" height="40"></section>
<section><div id="drag" draggable="true">Drag me</div><div id="drop">Drop here</div><output id="drop-result">none</output><iframe title="Audit frame" src="/frame.html"></iframe></section><div id="spacer"></div><button id="bottom">Bottom button</button>
<script>document.querySelector('#increment').onclick=()=>document.querySelector('#count').textContent=Number(document.querySelector('#count').textContent)+1;for(const id of ['single','multi'])document.getElementById(id).onchange=e=>document.querySelector('#files').textContent=Array.from(e.target.files).map(f=>f.name).join(',');document.querySelector('#drag').ondragstart=e=>e.dataTransfer.setData('text/plain','audit');document.querySelector('#drop').ondragover=e=>e.preventDefault();document.querySelector('#drop').ondrop=e=>{e.preventDefault();document.querySelector('#drop-result').textContent=e.dataTransfer.getData('text/plain')};console.log('audit fixture ready');
if(navigator.modelContext)console.log('navigator.modelContext available');if(document.modelContext){try{document.modelContext.registerTool({name:'audit_echo',description:'Echo a test string without external effects',inputSchema:{type:'object',properties:{text:{type:'string'}},required:['text']},execute:async({text})=>({content:[{type:'text',text}]})});}catch(e){console.log('webmcp registration',String(e))}}</script></html>
